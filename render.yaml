# Render "Blueprint": creates the website, the poller and the database in one go.
# In Render: New + > Blueprint > pick this repository. Then fill in the values marked sync: false.
services:
  - type: web
    name: far-post-web
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: far-post-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - fromGroup: far-post-data

  - type: worker
    name: far-post-poller
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci
    startCommand: npm run poller
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: far-post-db, property: connectionString }
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - fromGroup: far-post-data

envVarGroups:
  - name: far-post-data
    envVars:
      - key: FOOTBALL_PROVIDER
        value: mock
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_PLAN
        value: free
      - key: API_FOOTBALL_LEAGUE_ID
        value: "39"
      - key: API_FOOTBALL_SEASON
        value: "2026"
      - key: API_FOOTBALL_BATCH
        value: "true"

databases:
  - name: far-post-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
